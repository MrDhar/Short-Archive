name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Android project ZIP found."
            exit 1
          fi

          echo "Using ZIP: $ZIP"

          # Extract outside the repository checkout so existing
          # repository files cannot cause overwrite prompts.
          rm -rf extracted
          mkdir -p extracted

          unzip -q -o "$ZIP" -d extracted

          echo "Extracted project files:"
          find extracted -maxdepth 4 -type f | head -n 100

          # Find the Android Gradle project.
          PROJECT_DIR=$(find extracted \
            -maxdepth 5 \
            -type f \
            -name "settings.gradle*" \
            -printf '%h\n' \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Directory structure:"
            find extracted -maxdepth 6 -type f

            exit 1
          fi

          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure AndroidX and JVM
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          touch gradle.properties

          if ! grep -q "^android.useAndroidX=" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -q "^android.enableJetifier=" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          if ! grep -q "^kotlin.jvm.target.validation.mode=" gradle.properties; then
            echo "kotlin.jvm.target.validation.mode=warning" >> gradle.properties
          fi

      - name: Check Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project directory:"
          pwd

          echo
          echo "Project files:"
          ls -la

          echo
          echo "Gradle files:"
          find . -maxdepth 3 \
            \( -name "settings.gradle*" \
            -o -name "build.gradle*" \
            -o -name "gradlew" \) \
            -print

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" | head -n 1)

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo "Build output:"
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lime-debug-apk
          path: ${{ env.PROJECT_DIR }}/${{ env.APK_PATH }}
          if-no-files-found: error
